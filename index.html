<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a19">
  <title>SHAOS — Elegí un canal</title>
  <meta name="description" content="Explorá los canales de Minecraft de Shaos: Shaoskrr, ShaosMC y ShaosXD. Encontrá el contacto específico de cada canal.">
  <link rel="icon" type="image/png" href="assets/shaosxd.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SHAOS — Elegí un canal">
  <meta property="og:description" content="Tres canales, tres formas de crear contenido. Elegí cuál querés contactar.">
  <meta property="og:url" content="https://shaos.site/">
  <meta property="og:image" content="https://shaos.site/assets/shaosxd.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Conserva la propiedad de Google Analytics del sitio anterior. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z5P54LYRYN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments)}
    gtag('js', new Date());
    gtag('config', 'G-Z5P54LYRYN');
  </script>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <div class="scene-shade" aria-hidden="true"></div>

  <main class="home" aria-label="Seleccioná un canal de Shaos">
    <div class="channel-grid">
      <!-- 1: Shaoskrr -->
      <article class="channel-card channel-card--krr" aria-labelledby="title-krr">
        <div class="card-pixels" aria-hidden="true"></div>
        <div class="avatar-box">
          <img src="assets/shaoskrr.png" alt="Logo original de Shaoskrr" width="447" height="447" fetchpriority="high">
        </div>
        <div class="card-body">
          <h2 id="title-krr" class="channel-name">Shaoskrr</h2>
          <p class="subscribers"><span class="youtube-mark" aria-hidden="true"><svg viewBox="0 0 28 20"><rect x="0" y="0" width="28" height="20" rx="6" fill="currentColor"/><path d="M11.5 5.3 19.2 10l-7.7 4.7z" fill="#fff"/></svg></span><strong>1,8 millones</strong> <span>de suscriptores</span></p>
          <span class="separator" aria-hidden="true"></span>
          <p class="channel-description">Contenido más infantil</p>
          <button type="button" class="contact-btn" data-contact="shaoskrr" aria-label="Ver contacto de Shaoskrr">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><rect x="2.6" y="5.2" width="18.8" height="13.8" rx="2.3" stroke="currentColor" stroke-width="1.8"/><path d="m3.6 7 8.4 6 8.4-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            CONTACTO
            <svg class="button-arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </article>

      <!-- 2: ShaosMC -->
      <article class="channel-card channel-card--mc" aria-labelledby="title-mc">
        <div class="card-pixels" aria-hidden="true"></div>
        <div class="avatar-box">
          <img src="assets/shaosmc.png" alt="Logo original de ShaosMC" width="447" height="447">
        </div>
        <div class="card-body">
          <h2 id="title-mc" class="channel-name">ShaosMC</h2>
          <p class="subscribers"><span class="youtube-mark" aria-hidden="true"><svg viewBox="0 0 28 20"><rect x="0" y="0" width="28" height="20" rx="6" fill="currentColor"/><path d="M11.5 5.3 19.2 10l-7.7 4.7z" fill="#fff"/></svg></span><strong>9,2 millones</strong> <span>de suscriptores</span></p>
          <span class="separator" aria-hidden="true"></span>
          <p class="channel-description">Contenido internacional</p>
          <button type="button" class="contact-btn" data-contact="shaosmc" aria-label="Ver contacto de ShaosMC">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><rect x="2.6" y="5.2" width="18.8" height="13.8" rx="2.3" stroke="currentColor" stroke-width="1.8"/><path d="m3.6 7 8.4 6 8.4-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            CONTACTO
            <svg class="button-arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </article>

      <!-- 3: ShaosXD -->
      <article class="channel-card channel-card--xd" aria-labelledby="title-xd">
        <div class="card-pixels" aria-hidden="true"></div>
        <div class="avatar-box">
          <img src="assets/shaosxd.png" alt="Logo original de ShaosXD" width="447" height="447">
        </div>
        <div class="card-body">
          <h2 id="title-xd" class="channel-name">ShaosXD</h2>
          <p class="subscribers"><span class="youtube-mark" aria-hidden="true"><svg viewBox="0 0 28 20"><rect x="0" y="0" width="28" height="20" rx="6" fill="currentColor"/><path d="M11.5 5.3 19.2 10l-7.7 4.7z" fill="#fff"/></svg></span><strong>1,3 millones</strong> <span>de suscriptores</span></p>
          <span class="separator" aria-hidden="true"></span>
          <p class="channel-description">Contenido con acompañante</p>
          <button type="button" class="contact-btn" data-contact="shaosxd" aria-label="Ver contacto de ShaosXD">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><rect x="2.6" y="5.2" width="18.8" height="13.8" rx="2.3" stroke="currentColor" stroke-width="1.8"/><path d="m3.6 7 8.4 6 8.4-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            CONTACTO
            <svg class="button-arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </article>
    </div>
  </main>

  <!-- Mensaje temporal: se usa hasta definir las 3 rutas de contacto. -->
  <dialog class="contact-dialog" id="contact-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <div class="dialog-content">
      <button type="button" class="dialog-close" id="dialog-close" aria-label="Cerrar">&times;</button>
      <span class="dialog-icon" aria-hidden="true">✉</span>
      <h2 id="dialog-title">Contacto</h2>
      <p id="dialog-description">Próximamente vas a poder contactar a este canal desde su propia página.</p>
      <button type="button" class="dialog-back" id="dialog-back">Volver a los canales</button>
    </div>
  </dialog>

  <script src="script.js" defer></script>
</body>
</html>
